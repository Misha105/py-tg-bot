[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "py-tg-bot"
version = "0.1.0"
description = "Telegram bot with LM Studio integration"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.28",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "black>=24.0",
    "mypy>=1.13",
    "types-setuptools",
    "pytest-cov>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["bot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["bot", "tests", "scripts"]
fix = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF100"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["bot", "tests", "scripts"]

[tool.black]
line-length = 100
target-version = ["py311"]
skip-string-normalization = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
ignore_missing_imports = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["bot.handlers.*", "bot.middlewares.*"]
follow_imports = "silent"
warn_return_any = false
